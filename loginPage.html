<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminho do ACE</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="Body_Login">

    <div class="cardInfo">
        <h1>Login</h1>
    </div>

    <div class="cardLogin">

        <div class="ipts_login">
            <label>Nome Completo</label><br>
            <input id="ipt_nome" type="text" placeholder="Fulano da Silva"><br>

            <label>Email</label><br>
            <input id="ipt_email" type="email" placeholder="email@gmail.com"><br>

            <label>Senha</label> <br>
            <input id="ipt_senha" type="password" placeholder="********"><br>

            <label>Confirmar Senha</label><br>
            <input id="ipt_ConfirmaSenha" type="password" placeholder="********">
        </div>

            <button class="btnEntrar" onclick="Entrar()">Entrar</button>
        </div>
</body>

</html>
