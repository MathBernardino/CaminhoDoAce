<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caminho do Ace</title>

    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="./assets/icon/IconBola.png">
</head>

<body>
    <div class="navBar">
        <div class="navBar_FLY">
            <h1>FLY HIGH</h1>
        </div>

        <div class="nav_Bar_h3">
            <h3>Calculadora</h3>
            <a href="contexto.html">
                <h3>Contexto</h3>
            </a>
            <h3>Quiz</h3>
        </div>
    </div>

    <div class="quiz-card">
        <div id="introducao_quiz" style="display: block;">
            <h2>Um quiz para ajudar você a descobrir sua melhor arma!</h2>
            <button onclick="IniciarQuiz()">Inciar Quiz!</button>
        </div>

        <div id="perguntas_quiz" style="display: none;">
            <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de 10 questões.</span>

            <div id="perguntaDaQuestaoAtual" class="padding-8">
                <span id="spanQuestaoExibida" class="text-bold"></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
            </div>

            <div id="botoes" class="flex-colunar padding-8">
                <button onclick="submeter()" id="btnSubmeter">Responder</button>
                <button onclick="avancar()" id="btnProx" disabled>Próxima</button>
                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
            </div>
        </div>
    </div>


</body>

<script>
    const listaDeQuestoes = [
        {
            pergunta: "Em uma situação de pressão, você prefere…",
            alternativaA: "Tomar a decisão e organizar o time",
            alternativaB: "Evitar o erro antes de tudo",
            alternativaC: "Arriscar e resolver na força"
        },
        {
            pergunta: "Qual papel você assume no grupo?",
            alternativaA: "Quem distribui e articula as ideias",
            alternativaB: "Quem garante que nada vai errar",
            alternativaC: "Quem vai na frente e decide na hora H"
        },
        {
            pergunta: "Seu superpoder no esporte seria…",
            alternativaA: "Visão de jogo e leitura da defesa adversária",
            alternativaB: "Reflexos rápidos e agilidade no chão",
            alternativaC: "Força e precisão no ataque"
        },
        {
            pergunta: "Como você enfrenta um adversário difícil?",
            alternativaA: "Montando uma estratégia antes de agir",
            alternativaB: "Neutralizando as jogadas dele uma a uma",
            alternativaC: "Impondo meu ritmo com agressividade"
        },
        {
            pergunta: "O que te dá mais satisfação numa vitória?",
            alternativaA: "Ter feito a jogada certa na hora certa",
            alternativaB: "Ter defendido o indefensável",
            alternativaC: "Ter cravado o ponto decisivo"
        },
        {
            pergunta: "Qual ambiente te define mais?",
            alternativaA: "Sala de reunião: planejando tudo",
            alternativaB: "Linha de frente: defendendo o campo",
            alternativaC: "Palco: sendo o centro das atenções"
        },
        {
            pergunta: "Como você reage a um erro do time?",
            alternativaA: "Reajusto o plano imediatamente",
            alternativaB: "Trabalho o dobro na próxima bola",
            alternativaC: "Peço a bola e resolvo sozinho"
        },
        {
            pergunta: "Qual qualidade é mais sua?",
            alternativaA: "Inteligência tática",
            alternativaB: "Consistência e dedicação",
            alternativaC: "Explosão e potência"
        },
        {
            pergunta: "Seu estilo de jogo é mais…",
            alternativaA: "Calculado e criativo",
            alternativaB: "Resiliente e disciplinado",
            alternativaC: "Agressivo e dominante"
        },
        {
            pergunta: "O que não pode faltar no seu jogo?",
            alternativaA: "Sintonia com o time todo",
            alternativaB: "Concentração total em cada bola",
            alternativaC: "Confiança na hora do ataque"
        },
    ];

    const resultados = {
        alternativaA: {
            pos: "Levantador",
            desc: "Você é o cérebro da quadra. Estratégico, comunicativo e sempre atento ao momento certo de cada jogada. O time confia em você para ditar o ritmo."
        },
        alternativaB: {
            pos: "Líbero",
            desc: "Você é a última barreira antes do ponto. Resiliente, focado e com reflexos afiados. Nenhuma bola cai enquanto você estiver em quadra."
        },
        alternativaC: {
            pos: "Oposto (ACE)",
            desc: "Você é o jogador decisivo. Potente, confiante e feito para os momentos mais importantes. Quando o jogo aperta, todos olham para você."
        }
    };

    function IniciarQuiz() {
        introducao_quiz.style.display = 'none';
        perguntas_quiz.style.display = 'block';
    }

    let numeroDaQuestaoAtual = 0

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false)

            checarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
    }

    function avancar() {
        btnProx.disabled = true
        btnSubmeter.disabled = false

        desmarcarRadioButtons()

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
            alert("Atenção... a próxima é a ultima questão!")
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
        limparCoresBackgroundOpcoes()
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {
        let textoParaMensagemFinal = null
        let classComCoresParaMensagemFinal = null
        const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes

        if (porcentagemFinalDeAcertos <= 0.3) {
            textoParaMensagemFinal = "Parece que você não estudou..."
            classComCoresParaMensagemFinal = "text-danger-with-bg"
        }
        else if (porcentagemFinalDeAcertos > 0.3 && porcentagemFinalDeAcertos < 0.9) {
            textoParaMensagemFinal = "Pode melhorar na próxima, hein!"
            classComCoresParaMensagemFinal = "text-warning-with-bg"
        }
        else if (porcentagemFinalDeAcertos >= 0.9) {
            textoParaMensagemFinal = "Uau, parabéns!"
            classComCoresParaMensagemFinal = "text-success-with-bg"
        }

        textoParaMensagemFinal += "<br> Você acertou " + Math.round((porcentagemFinalDeAcertos) * 100) + "% das questões."


        document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal
        document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal)
        document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

        document.getElementById('jogo').classList.add("text-new-gray")

        btnProx.disabled = true
        btnSubmeter.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = false

    }

</script>
