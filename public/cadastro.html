<script>

  // Array para armazenar usuarios cadastradas para validação de código de ativação 
  let listaUsuariosCadastrados = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var idUsuarioVincular
    var divErros = document.getElementById("div_erros_login");

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {

      divErros.style.display = "flex";
      divErros.innerHTML = "Preencha todos os campos!";

    } else if (nomeVar.length < 3) {
      divErros.style.display = "flex";
      divErros.innerHTML = "Seu nome deve ter no minimo 3 caracteres!";

    } else if (!emailVar.includes("@")) {
      divErros.style.display = "flex";
      divErros.innerHTML = "Seu Email deve conter um @ aliado ao seu provedor!";

    } else if (senhaVar.length < 6) {
      divErros.style.display = "flex";
      divErros.innerHTML = "Sua senha deve conter mais de 5 caracteres!";
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idUsuarioVincularServer: idUsuarioVincular
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          divErros.style.display = "flex";
          divErros.innerHTML = "Cadastro realizado com sucesso!";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");
        } else {
          throw divErros.style.display = "flex";
          divErros.innerHTML = "Houve um erro no login!";;
        }
      })
      .catch(function (resposta) {

      });

    return false;
  }
</script>
