<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAMINHO DO ACE</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/icon/IconBola.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body class="Body_Login">

    <div class="navBar">
        <div class="navBar_FLY">
            <a href="index.html">
                <h1>FLY HIGH</h1>
            </a>
        </div>

        <div class="nav_Bar_h3">
            <a href="login.html"><h3>Login</h3></a> 
            <a href="contexto.html"><h3>Contexto</h3></a>
            <a href="quiz.html"><h3>Quiz</h3></a> 
        </div>
    </div>

    <body>
        <div class="login">
            <div class="cardLogin">
                <h2>Bem-vindo!</h2>
                <div class="formulario">
                    <div class="campos">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
                    </div>
                    <div class="campos">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******" />
                    </div>
                    <label style="color: white">Não possui conta? <a href="cadastro.html"
                            style="text-decoration: none; color: inherit;"><span
                                class="destaque">Cadastre-se</span></a></label>
                    <button class="btnEntrar" onclick="entrar()">Entrar</button>
                    <div id="div_erros_login" class="mensagem_erro"></div>
                </div>
            </div>
            <div class="background_login"></div>
        </div>


    </body>

</html>

<script>
    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            var divErros = document.getElementById("div_erros_login");
            divErros.style.display = "flex";
            divErros.innerHTML = "Preencha todos os campos!";
            return false;
        }
        else {

            console.log("FORM LOGIN: ", emailVar);
            console.log("FORM SENHA: ", senhaVar);

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ emailServer: emailVar, senhaServer: senhaVar })
            }).then(function (resposta) {
                console.log("STATUS:", resposta.status); // ← adicione isso
                if (resposta.ok) {
                    resposta.json().then(json => {
                        console.log("JSON:", json); // ← e isso
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        setTimeout(function () {
                            window.location = "/index.html";
                        }, 1000);
                    });
                } else {
                    resposta.text().then(texto => {
                        console.error("ERRO RESPOSTA:", texto); // ← e isso
                    });
                }
            }).catch(function (erro) {
                console.log("CATCH ERRO:", erro); // ← e isso
            })

    }
    return false;
    }
</script>
